# Central configuration. DVC stages read these values, so changing one reruns the affected stages.
data:
  first_month: "2025-06"   # 8 weeks of history before training starts, and all CHI-format station IDs
  last_month: "2026-09"

split:                     # Decision D4: chronological, inclusive of both months
  train: ["2025-08", "2025-12"]
  validation: ["2026-01", "2026-01"]
  test: ["2026-02", "2026-02"]
  replay: ["2026-03", "2026-09"]

forecast:                  # Decision D3
  horizons: [1, 2, 3]
  targets: [pickups, dropoffs]

stations:                  # Decision D2
  min_trips_per_day: 5
  trailing_days: 28
  allowed_types: [classic]
  merge_distance_metres: 100

validation:
  max_rejected_share: 0.10  # stop the pipeline if more rows than this are rejected

model:                     # Milestone 2: LightGBM tuned with Ray Tune
  tuning_sample_rows: 1500000
  num_samples: 12          # trials per target
  max_concurrent_trials: 3
  threads_per_trial: 2
  ray_object_store_bytes: 1500000000
  max_rounds: 3000
  early_stopping_rounds: 100
  final_threads: 6

evaluation:
  tier_bounds: [5, 10, 20] # trips per day: 5-10, 10-20, 20+
  peak_hours: [7, 8, 9, 16, 17, 18]

seed: 42

serving:                   # Milestone 3: FastAPI service. No DVC stage reads these.
  model_name: bikeshare-demand
  model_alias: champion
  model_poll_seconds: 30   # how often to check whether the champion alias moved
  feature_workers: 4       # processes running the shared feature function
  alert_limit: 10          # stations listed per direction (Decision D1)
  min_pressure: 0.1        # list a station only if 3-hour net flow is at least 10% of capacity

monitoring:                # Milestone 5, Decision D9. Thresholds are calibrated in reports/monitoring_calibration.json.
  window_days: 7           # rolling window for error and drift
  bins: 10                 # PSI bins, at training-window deciles
  profile_sample_rows: 500000
  drift_columns:           # strongest demand inputs by SHAP, plus both forecasts
    - pickups_same_hour_8w_mean
    - dropoffs_same_hour_8w_mean
    - pickups_mean_24h
    - dropoffs_mean_24h
    - trips_per_day_28d
    - pickups_forecast
    - dropoffs_forecast
  thresholds:              # calibrated 2026-11-13 (reports/monitoring_calibration.json); approved 2026-11-14
    max_psi: 0.5           # training-window PSI reaches 2.5 within itself; replay peaks at 1.04
    relative_wape: 1.0     # the model is no better than the historical average it falls back to
    sustain_days: 5        # 3 days gave two false error alerts in February; 5 gave none

promotion:                 # Milestone 6 promotion gate (Decision D9); approved 2026-11-14
  tier_tolerance: 0.03     # a challenger may be at most 3% worse than the champion on any
                           # horizon or volume tier; one model's tier WAPE ratio moves a median
                           # 2.4-2.8% week to week
                           # baselines must be beaten only where the champion beats them
  gate_days: 14            # the challenger and champion are compared on the last 14 days before
                           # the retraining time, which neither trained on

retraining:                # Milestone 6, Decision D9. No DVC stage reads these.
  early_stopping_days: 14  # the 14 days before the gate window stop boosting early; 7 days
                           # was unstable (one hour's shift halved the stopping round)
  cooldown_days: 7         # simulated days after one attempt before an alert can start another
  threads: 6               # LightGBM threads, as for the original training

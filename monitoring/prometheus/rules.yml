# Alert rules. Model thresholds live in params.yaml and reach Prometheus through the
# backend's bikeshare_monitor_threshold gauge, so there is one place to change them.
#
# Model alerts count simulated days, not wall-clock time: the backend reports how many
# consecutive replayed days breached a threshold, and the alert fires once that reaches
# sustain_days. A fast or slow replay therefore raises the same alerts.
groups:
  - name: bikeshare-model
    rules:
      - alert: BikeshareInputDrift
        expr: >
          bikeshare_monitor_breach_days{signal="drift"}
          >= ignoring(signal, name) bikeshare_monitor_threshold{name="sustain_days"}
        labels:
          severity: warning
          action: retrain
        annotations:
          summary: Model inputs or forecasts have drifted from the training window
          description: >
            The largest 7-day PSI has exceeded its threshold for {{ $value }} consecutive
            simulated days.

      - alert: BikeshareForecastDegraded
        expr: >
          bikeshare_monitor_breach_days{signal="error"}
          >= ignoring(signal, name) bikeshare_monitor_threshold{name="sustain_days"}
        labels:
          severity: warning
          action: retrain
        annotations:
          summary: The model is no better than the historical-average fallback
          description: >
            7-day model WAPE divided by historical-average WAPE has exceeded its threshold
            for {{ $value }} consecutive simulated days.

  - name: bikeshare-service
    rules:
      - alert: BikeshareBackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape the backend

      - alert: BikeshareServerErrors
        expr: sum(rate(bikeshare_requests_total{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The backend is returning 5xx responses

      - alert: BikeshareSlowRequests
        # Computing an uncached day takes 15 to 35 s, so only sustained slowness alerts.
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(bikeshare_request_seconds_bucket{endpoint!="/metrics"}[10m])))
          > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 95th-percentile request latency above 20 s for 10 minutes

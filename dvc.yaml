# Run with the project venv active: dvc repro
stages:
  ingest:
    cmd: PYTHONPATH=src python -m bikeshare.data.ingest
    deps:
      - src/bikeshare/data/ingest.py
    params:
      - data
    outs:
      - data/raw
  clean:
    cmd: PYTHONPATH=src python -m bikeshare.data.clean
    deps:
      - data/raw
      - src/bikeshare/data/clean.py
      - src/bikeshare/spark.py
    params:
      - validation
    outs:
      - data/interim/trips
    metrics:
      - reports/data_quality.json:
          cache: false
  stations:
    cmd: PYTHONPATH=src python -m bikeshare.data.stations
    deps:
      - data/interim/trips
      - data/raw
      - src/bikeshare/data/stations.py
      - src/bikeshare/spark.py
    params:
      - stations.merge_distance_metres
    outs:
      - data/interim/stations.parquet
      - data/interim/station_name_map.parquet
    metrics:
      - reports/stations.json:
          cache: false
  panel:
    cmd: PYTHONPATH=src python -m bikeshare.data.panel
    deps:
      - data/interim/trips
      - data/interim/stations.parquet
      - data/interim/station_name_map.parquet
      - src/bikeshare/data/panel.py
      - src/bikeshare/spark.py
    outs:
      - data/processed/panel
    metrics:
      - reports/panel.json:
          cache: false
  features:
    cmd: PYTHONPATH=src python -m bikeshare.data.build_features
    deps:
      - data/processed/panel
      - data/interim/stations.parquet
      - src/bikeshare/features.py
      - src/bikeshare/data/build_features.py
      - src/bikeshare/spark.py
    params:
      - forecast.horizons
      - split.train
      - stations.min_trips_per_day
      - stations.allowed_types
    outs:
      - data/processed/features
    metrics:
      - reports/features.json:
          cache: false
  tune:
    cmd: PYTHONPATH=src python -m bikeshare.modeling.tune
    deps:
      - data/processed/features
      - src/bikeshare/modeling/tune.py
      - src/bikeshare/modeling/boosting.py
      - src/bikeshare/modeling/dataset.py
      - src/bikeshare/modeling/metrics.py
    params:
      - model
      - split
      - seed
    outs:
      - reports/best_params.json:
          cache: false
  train:
    cmd: PYTHONPATH=src python -m bikeshare.modeling.train
    deps:
      - data/processed/features
      - reports/best_params.json
      - src/bikeshare/modeling
    params:
      - model
      - split
      - evaluation
      - seed
    outs:
      - models
      - reports/importance.json:
          cache: false
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/importance.png:
          cache: false
  profile:
    # Logs the drift reference profile to the trained model's MLflow run (needs the server).
    cmd: PYTHONPATH=src python -m bikeshare.monitoring.profile
    deps:
      - data/processed/features
      - reports/metrics.json
      - src/bikeshare/monitoring/drift.py
      - src/bikeshare/monitoring/profile.py
    params:
      - split.train
      - seed
      - monitoring.bins
      - monitoring.drift_columns
      - monitoring.profile_sample_rows
    outs:
      - reports/reference_profile.json:
          cache: false
  calibrate:
    cmd: PYTHONPATH=src python -m bikeshare.monitoring.calibrate
    deps:
      - data/processed/features
      - reports/metrics.json
      - reports/reference_profile.json
      - src/bikeshare/monitoring/calibrate.py
      - src/bikeshare/monitoring/drift.py
      - src/bikeshare/monitoring/profile.py
      - src/bikeshare/monitoring/windows.py
      - src/bikeshare/serving/forecast.py
    params:
      - split
      - evaluation.tier_bounds
      - monitoring.window_days
      - monitoring.thresholds
    metrics:
      - reports/monitoring_calibration.json:
          cache: false
    plots:
      - reports/monitoring_calibration.png:
          cache: false
